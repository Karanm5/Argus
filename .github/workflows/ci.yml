name: ARGUS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  # Tests use mocked LLM calls so no real API key is needed
  ANTHROPIC_API_KEY: "test-key-for-ci"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Linting and type checking
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install mypy

      

  # ──────────────────────────────────────────────────────────────
  # Job 2: Unit tests with coverage
  # ──────────────────────────────────────────────────────────────
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=argus \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: unittests

  # ──────────────────────────────────────────────────────────────
  # Job 3: Docker build smoke test
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t argus:ci .

      - name: Smoke test container
        run: |
          docker run --rm \
            -e ANTHROPIC_API_KEY=test-key \
            argus:ci \
            python -c "from argus.config import config; print('Config OK:', config.llm.model)"
