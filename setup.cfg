[metadata]
name = argus-reasoning
version = 0.1.0
description = Adaptive Reasoning with Guided Uncertainty Sampling
author = Karan Meena
author_email = meena.karan9k@gmail.com
url = https://github.com/Karanm5/argus
license = MIT
python_requires = >=3.10

[options]
packages = find:
install_requires =
    anthropic>=0.30.0
    langgraph>=0.2.0
    langchain-core>=0.2.0
    sentence-transformers>=3.0.0
    scikit-learn>=1.5.0
    numpy>=1.26.0
    chromadb>=0.5.0
    fastapi>=0.111.0
    uvicorn[standard]>=0.30.0
    pydantic>=2.7.0
    streamlit>=1.36.0
    plotly>=5.22.0
    requests>=2.32.0
    python-dotenv>=1.0.0

[options.extras_require]
dev =
    pytest>=8.0.0
    pytest-cov>=5.0.0
    pytest-asyncio>=0.23.0
    ruff>=0.4.0
    mypy>=1.10.0
    httpx>=0.27.0

[tool:pytest]
testpaths = tests
addopts = -v --tb=short
asyncio_mode = auto

[ruff]
line-length = 100
target-version = py311
